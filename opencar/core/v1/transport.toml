[mqtt]
command_topic_template = "opencar/{client_id}/cmd"
data_topic_template = "opencar/{client_id}/data"

[ble.service]
name = "Open Car Control"
uuid = "1acff001-229b-4d38-a5d2-9af1d9b11f00"

[ble.characteristics.app_to_device]
uuid = "1acff002-229b-4d38-a5d2-9af1d9b11f00"
payload = "opencar.core.v1.AppToDevice"
properties = ["write", "write_without_response"]
direction = "app -> device"

[ble.characteristics.device_to_app]
uuid = "1acff003-229b-4d38-a5d2-9af1d9b11f00"
payload = "opencar.core.v1.DeviceToApp"
properties = ["notify"]
direction = "device -> app"

[ble.pairing]
# How long (seconds) the device keeps its pairing window open after the
# pairing button is pressed. The app wizard uses this as its bond timeout.
pairing_window_seconds = 60
# How long (seconds) the wizard scans for an advertising device before
# declaring a timeout and asking the user to try again.
scan_timeout_seconds = 30

[ble.payload]
# ATT MTU the app requests after connecting. The device supports it.
att_mtu = 247
# Largest ATT value (one write or notification), in bytes: att_mtu minus the
# 3-byte ATT header. One chunk (header + data) always fits in this.
max_chunk_bytes = 244
# Largest reassembled AppToDevice / DeviceToApp message, in bytes. Messages
# larger than one chunk are fragmented, see [ble.fragmentation]. The CRC that
# follows the message is not counted.
max_message_bytes = 4096

[ble.fragmentation]
# Every write and notification is one chunk: a 2-byte header followed by a
# slice of the message stream. See docs/ble-fragmentation.md.
# Header byte 0: bit 7 is LAST (1 on the final chunk), bits 0-6 are the chunk
# index (0 for the first chunk, +1 per chunk, no wrap, at most 128 chunks).
# Header byte 1: message sequence number, the same on every chunk of a
# message; the sender increments it (mod 256) per message and per direction.
header_bytes = 2
last_chunk_flag = 0x80
chunk_index_mask = 0x7f
max_chunks = 128
# The message stream is the encoded message followed by this many bytes: a
# CRC-32/ISO-HDLC (the zlib CRC-32) of the encoded message, big-endian.
# max_message_bytes does not include them.
crc_bytes = 4
# Chunk data per ATT packet at the requested MTU: max_chunk_bytes - header_bytes.
max_chunk_data_bytes = 242
# Smallest negotiated ATT MTU that can carry max_message_bytes (plus the CRC)
# in max_chunks.
min_att_mtu = 64
# A partial message is discarded if the next chunk does not arrive within this
# time, on disconnect, on a chunk index gap, on a sequence mismatch, on a CRC
# mismatch, or when a new chunk 0 arrives.
reassembly_timeout_ms = 2000

[ble.notes]
pairing = "Recommended before enabling control commands."
mtu = "Request ble.payload.att_mtu after connecting. Chunk data size is the negotiated MTU minus 5 bytes (3 ATT + 2 chunk header)."
fragmentation = "Every message is sent as chunks with a 2-byte header (LAST flag + 7-bit index, message sequence number) followed by the message and its CRC-32, up to ble.payload.max_message_bytes reassembled. Partial messages are discarded on disconnect, index gap, sequence mismatch, timeout or CRC mismatch. See docs/ble-fragmentation.md."
