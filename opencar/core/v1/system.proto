syntax = "proto3";
package opencar.core.v1;

// This holds the system specific state.
message SystemState {
  // The current firmware version string, based on the Github official tagged
  // version or custom build.
  string firmware_version = 1;

  // The hardware type of the device (e.g. ESP32-S3)
  string hardware_type = 2;

  // The uptime of the device in seconds.
  uint32 uptime_s = 3;

  // The LTE signal strength in dBm.
  int32 lte_rssi = 4;

  // Whether the device may transmit on the car's CAN buses, and which of the
  // conditions for it hold. BLE only. Sent in a state update of its own (with
  // no vehicle_state) whenever it changes and when the app subscribes.
  optional CanAccessState can_access = 5;

  // Which of the vehicle's commands the device accepts right now. Sent over BLE
  // and over MQTT (MQTT clients only get the basic commands). Sent whenever it
  // changes, repeated while unchanged, and when the app subscribes. The app
  // must only trust one received on the current connection: never a cached or
  // older one.
  optional CommandAvailability command_availability = 6;

  // How far the device trusts the connected phone, and its validation session.
  // BLE only, about the phone it is sent to. Sent with can_access, in the same
  // state update, whenever either changes, repeated while unchanged, and when
  // the app subscribes.
  optional PhoneAccessState phone_access = 7;
}

// This contains a single system command.
message SystemCommand {
  // The system command.
  oneof action {
    // A restart command.
    RestartCommand restart_command = 1;

    // Deprecated: the BLE CAN debug stream was removed from the firmware; CAN
    // logging now goes to SavvyCAN over WiFi. The firmware ignores this.
    SetCanDebugEnabled set_can_debug_enabled = 2 [deprecated = true];

    // Deprecated: see set_can_debug_enabled. The firmware ignores this.
    UpdateCanDebugFilters update_can_debug_filters = 3 [deprecated = true];

    // Returns the currently bonded BLE phones.
    ListPairedPhonesCommand list_paired_phones = 4;

    // Removes one bonded BLE phone by its stable device ID.
    RemovePairedPhoneCommand remove_paired_phone = 5;

    // Removes all bonded BLE phones.
    ClearPairedPhonesCommand clear_paired_phones = 6;

    // Records a newly paired BLE phone in the bonded registry.
    UpsertPairedPhoneCommand upsert_paired_phone = 7;

    // Approves (or revokes) CAN read-write mode for the car the device is
    // plugged into. BLE only, from a bonded phone; never accepted over MQTT.
    SetCanReadWriteApprovalCommand set_can_read_write_approval = 8;

    // Locks or unlocks CAN read-write mode in development builds. BLE only,
    // from a bonded phone; never accepted over MQTT. Rejected by release
    // builds, which don't have the lock.
    SetCanDevWriteUnlockCommand set_can_dev_write_unlock = 9;

    // Lists the ways this car offers to validate a phone. BLE only, from a
    // bonded phone. Answered with SystemCommandResult.validation_methods.
    ListPhoneValidationMethodsCommand list_phone_validation_methods = 10;

    // Starts validating the sending phone with one of the car's methods. BLE
    // only, from a bonded phone. Answered with
    // SystemCommandResult.validation_session.
    StartPhoneValidationCommand start_phone_validation = 11;

    // Submits the code the car shows, for a code entry session started by the
    // sending phone. Answered with SystemCommandResult.validation_session.
    SubmitPhoneValidationCodeCommand submit_phone_validation_code = 12;

    // Ends the validation session the sending phone started.
    CancelPhoneValidationCommand cancel_phone_validation = 13;
  }
}

// This command tells the system to restart.
message RestartCommand {}

// Deprecated: the BLE CAN debug stream was removed from the firmware and the
// message is ignored. Kept so field numbers stay reserved (append-only).
//
// Enables or disables on-demand CAN debug streaming over BLE.
//
// When enabled, raw CAN frames (before vehicle-specific filtering) are batched
// and sent to the app as CanDebugUpdate messages on the existing DeviceToApp
// BLE characteristic. No new characteristic or subscription is required.
//
// This command is sent via the existing AppToDevice BLE characteristic.
message SetCanDebugEnabled {
  option deprecated = true;

  // Whether to enable (true) or disable (false) CAN debug streaming.
  bool enabled = 1;

  // The CAN bus IDs to stream. Each value is a 0-based bus index matching the
  // order of [[can_buses]] entries in the device config. An empty list means
  // all buses are observed.
  repeated uint32 bus_ids = 2;
}

// Deprecated: see SetCanDebugEnabled. Ignored by the firmware.
//
// Replaces the full CAN debug blocklist. Silently ignored if CAN debug is
// not currently active.
//
// The app owns the filter state; this message always sends the complete desired
// list. The firmware replaces its stored list atomically on receipt. To clear
// all filters (pass everything), send an empty list.
message UpdateCanDebugFilters {
  option deprecated = true;

  // The new blocklist. Any frame matching any entry is excluded from the
  // CanDebugUpdate stream. An empty list means all frames are forwarded.
  repeated CanDebugFilter filters = 1;
}

// A single CAN debug blocklist entry. A frame is excluded from the debug stream
// if: (frame_can_id & mask) == (can_id & mask) AND is_extended_id matches.
//
// The blocklist applies across all buses being observed; there is no per-bus
// filter scoping.
message CanDebugFilter {
  // The CAN identifier to match against.
  uint32 can_id = 1;

  // True if this filter targets extended (29-bit) frame IDs; false for
  // standard (11-bit) frame IDs.
  bool is_extended_id = 2;

  // Acceptance mask. Bits set to 1 must match between the frame ID and
  // can_id. Use 0x7FF for exact standard-ID match, 0x1FFFFFFF for exact
  // extended-ID match, or 0 to block every frame regardless of ID.
  uint32 mask = 3;
}

// Requests the list of currently bonded BLE phones. Answered with
// SystemCommandResult.paired_phones.
message ListPairedPhonesCommand {}

// Requests removal of a single bonded BLE phone. Removing a phone validated
// for the identified car needs a validated phone (see PhoneTrustLevel).
message RemovePairedPhoneCommand {
  // Stable firmware-owned identifier for the bonded phone.
  bytes device_id = 1;
}

// Requests removal of all bonded BLE phones. Needs a validated phone once a
// phone is validated for the identified car.
message ClearPairedPhonesCommand {}

// Adds a bonded BLE phone if it is not already present.
message UpsertPairedPhoneCommand {
  // Stable firmware-owned identifier for the bonded phone.
  bytes device_id = 1;
}

// A firmware-initiated event pushed to the app with no associated inbound
// command. Delivered over the DeviceToApp BLE characteristic.
message SystemEvent {}

// Approves or revokes CAN read-write mode: the device leaving read-only mode
// on the car's CAN buses so it can send commands to the car.
//
// Read-write mode needs all of these, and the bus stays read-only while any is
// missing. First, the vehicle has recognised its platform on the bus and
// identified the exact car (CanAccessState.car_identity_confirmed). Second, the
// owner approved read-write mode for that car with this command. Third, in
// development builds, the dev lock is unlocked (SetCanDevWriteUnlock).
//
// An approval binds to the car identified when it is given, and is refused
// while no car is identified. It survives reboots and pairing or removing
// phones. It no longer applies if the device is moved to another car (approve
// again there, which replaces it), and it is cleared by revoking it or by
// erasing the device's flash. The app must show the risk before sending
// approved = true. BLE only, from a bonded phone; never accepted over MQTT.
//
// The approval only lets the device send the platform's own frames that don't
// act on the car (the identity request, text on the cluster). Vehicle commands
// also need a validated phone (see PhoneTrustLevel). Once a phone is validated
// for the identified car, only a validated phone can change the approval.
// Approving another car than the one the validations belong to erases every
// validation: the phones stay bonded and validate again in that car.
message SetCanReadWriteApprovalCommand {
  // True approves read-write mode for the identified car; false revokes the
  // approval, which makes the bus read-only again.
  bool approved = 1;
}

// Locks or unlocks CAN read-write mode in development builds, on top of the
// owner's approval. Locked at every boot and not stored. Release builds don't
// have the lock and reject this command (CanAccessState.dev_lock_available is
// false). BLE only, from a bonded phone; never accepted over MQTT.
message SetCanDevWriteUnlockCommand {
  // True unlocks read-write mode; false locks it again.
  bool unlocked = 1;
}

// Whether the device may transmit on the car's CAN buses, and why not.
message CanAccessState {
  // The vehicle recognised its own platform on the bus (the firmware matches
  // the car's platform).
  optional bool platform_confirmed = 1;

  // The vehicle identified the exact car it is plugged into. The approval is
  // bound to it.
  optional bool car_identity_confirmed = 2;

  // The owner's approval of read-write mode, compared with the identified car.
  optional CanReadWriteApproval approval = 3;

  // True in development builds, which have the dev lock.
  optional bool dev_lock_available = 4;

  // The dev lock is unlocked. Always false in release builds.
  optional bool dev_unlocked = 5;

  // A CAN logging (SavvyCAN) session is active, which forces read-only mode.
  optional bool logging = 6;

  // The effective state: true while the device must not transmit on any bus.
  // False only when every condition above allows read-write mode and the
  // vehicle has unlocked the bus.
  optional bool read_only = 7;
}

// The owner's approval of CAN read-write mode.
enum CanReadWriteApproval {
  // Unknown (an older firmware, or not reported).
  CAN_READ_WRITE_APPROVAL_UNSPECIFIED = 0;
  // Read-write mode was never approved, or the approval was revoked.
  CAN_READ_WRITE_APPROVAL_NOT_APPROVED = 1;
  // Approved for the car the device is plugged into.
  CAN_READ_WRITE_APPROVAL_APPROVED = 2;
  // Approved for another car than the one identified. The bus stays
  // read-only until the owner approves this car, which replaces the approval.
  CAN_READ_WRITE_APPROVAL_OTHER_CAR = 3;
  // An approval is stored but no car is identified yet, so it can't be
  // checked. The bus stays read-only.
  CAN_READ_WRITE_APPROVAL_AWAITING_CAR = 4;
}

// Which commands the device accepts right now, from the vehicle state. The
// device rejects any other command with
// COMMAND_STATUS_CODE_REJECTED_UNAVAILABLE, even if the app sends it anyway.
// The app greys out unavailable commands and shows no reason.
//
// Commands are identified by their field number in the vehicle's command
// oneof, so this stays vehicle-agnostic: the keys of `basic` are the field
// numbers of the platform's BasicCommand.action, the keys of `advanced` those
// of its AdvancedCommand.action. The maps merge per key, so an update may carry
// only the commands that changed. A command that has no entry has not been
// reported: treat it as unavailable.
//
// Over BLE it is for the connected phone: every command is unavailable while
// that phone is not validated (PhoneAccessState.trust).
message CommandAvailability {
  // Availability of the basic commands by field number.
  map<uint32, CommandAvailabilityState> basic = 1;

  // Availability of the advanced commands by field number. BLE only: never
  // sent over MQTT.
  map<uint32, CommandAvailabilityState> advanced = 2;
}

// Whether a command can be run right now.
enum CommandAvailabilityState {
  // Unknown (not reported yet, or an older firmware). Treat as unavailable.
  COMMAND_AVAILABILITY_STATE_UNSPECIFIED = 0;
  // The command is accepted now.
  COMMAND_AVAILABILITY_STATE_AVAILABLE = 1;
  // Not available right now, for example the device is read-only, the car
  // state is out of date, or the car is driving. The app greys the button out.
  COMMAND_AVAILABILITY_STATE_UNAVAILABLE = 2;
  // Not available on this car, for example a trim without the feature. The
  // app usually hides the button. Reserved: no firmware sends it yet.
  COMMAND_AVAILABILITY_STATE_UNSUPPORTED = 3;
}

// How far the device trusts a phone. Vehicle commands (basic and advanced
// commands, from any platform) need a validated phone, on top of the CAN
// read-write approval and, in development builds, the dev lock.
enum PhoneTrustLevel {
  // Unknown (an older firmware, or not reported).
  PHONE_TRUST_LEVEL_UNSPECIFIED = 0;
  // Not bonded: it can only pair, while the pairing window is open.
  PHONE_TRUST_LEVEL_NOT_BONDED = 1;
  // Bonded during a pairing window. It can send system commands, but no
  // vehicle command, and it can't change the approval or remove a validated
  // phone once a phone is validated for this car.
  PHONE_TRUST_LEVEL_BONDED = 2;
  // Bonded and validated in the identified car, by an in-car action that
  // proves it is the owner's (see StartPhoneValidationCommand). A validation
  // belongs to one car: it doesn't apply while another car, or no car, is
  // identified. It ends when the phone's bond is removed, when the bonds are
  // reset, or when another car is approved.
  PHONE_TRUST_LEVEL_VALIDATED = 3;
}

// What the device allows the connected phone.
message PhoneAccessState {
  // The connected phone's trust level, for the identified car.
  optional PhoneTrustLevel trust = 1;

  // A phone is validated for the identified car. Until then, a bonded phone
  // can approve or revoke CAN read-write mode (first setup); after that, only
  // a validated phone can.
  optional bool car_has_validated_phone = 2;

  // The connected phone's latest validation session, while it runs and for a
  // while after it ends (its status then says how). Not set when the phone
  // has no session.
  optional PhoneValidationSession validation = 3;
}

// Lists the ways this car offers to validate a phone.
message ListPhoneValidationMethodsCommand {}

// Starts validating the sending phone. One session runs at a time, for one
// phone, and ends when it succeeds, fails, is cancelled or times out. The
// phone must be bonded and the exact car identified, since the validation
// belongs to that car. Refused while another phone's session runs, and during
// the cooldown after a code entry session used all its attempts. Starting
// again from the same phone replaces its session (a code entry method then
// shows a new code).
message StartPhoneValidationCommand {
  // The method's identifier, from PhoneValidationMethod.method_id.
  string method_id = 1;
}

// Submits the code the car shows. A wrong code uses one attempt; the session
// fails once all are used, and the cooldown starts.
message SubmitPhoneValidationCodeCommand {
  // The digits as entered, e.g. "042917".
  string code = 1;
}

// Ends the sending phone's validation session.
message CancelPhoneValidationCommand {}

// How the owner validates a phone with a method.
enum PhoneValidationMethodKind {
  // Unknown (a newer firmware). The app shows the method's generic text.
  PHONE_VALIDATION_METHOD_KIND_UNSPECIFIED = 0;
  // The car shows a code (on the cluster, for example) and the owner types it
  // in the app. The app shows a code input.
  PHONE_VALIDATION_METHOD_KIND_CODE_ENTRY = 1;
  // The owner does something in the car (switch it on and press a button,
  // for example), which the device detects. The app shows instructions and
  // waits for PhoneAccessState.validation to end.
  PHONE_VALIDATION_METHOD_KIND_IN_CAR_ACTION = 2;
}

// One way of validating a phone in the car.
message PhoneValidationMethod {
  // Stable identifier, e.g. "egmp.cluster_code". The app maps it to
  // localized text, with a generic text for the kind when it doesn't know it.
  string method_id = 1;

  // What the app shows for it.
  PhoneValidationMethodKind kind = 2;

  // The method sends frames to the car (a code shown on the cluster), so it
  // only works while the device may send them: the car approved for CAN
  // read-write mode and, in development builds, the dev lock unlocked.
  bool needs_approval = 3;

  // The method can be started now. False while it needs the approval and the
  // device is read-only, or the car isn't identified.
  bool available = 4;
}

// The car's validation methods, in the order the app offers them.
message PhoneValidationMethods {
  // The methods.
  repeated PhoneValidationMethod methods = 1;
}

// How a validation session is going.
enum PhoneValidationStatus {
  // Unknown (an older firmware, or not reported).
  PHONE_VALIDATION_STATUS_UNSPECIFIED = 0;
  // Waiting for the code or the in-car action.
  PHONE_VALIDATION_STATUS_IN_PROGRESS = 1;
  // The phone is validated.
  PHONE_VALIDATION_STATUS_SUCCEEDED = 2;
  // Every attempt was used with a wrong code. The cooldown runs.
  PHONE_VALIDATION_STATUS_FAILED = 3;
  // The session ran out of time.
  PHONE_VALIDATION_STATUS_TIMED_OUT = 4;
  // The phone cancelled it, started another one, or the car changed.
  PHONE_VALIDATION_STATUS_CANCELLED = 5;
}

// A validation session of one phone.
message PhoneValidationSession {
  // The method it uses.
  string method_id = 1;

  // The method's kind.
  PhoneValidationMethodKind kind = 2;

  // Where it stands.
  PhoneValidationStatus status = 3;

  // Code entry only: the number of digits of the code.
  uint32 code_length = 4;

  // Code entry only: the wrong codes still accepted before the session fails.
  uint32 attempts_left = 5;

  // Seconds until the session times out, while in progress.
  uint32 expires_in_s = 6;

  // Seconds until a new session can be started, after a failed one.
  uint32 cooldown_s = 7;
}

// One bonded phone.
message PairedPhone {
  // Stable firmware-owned identifier, as in RemovePairedPhoneCommand.
  bytes device_id = 1;

  // Its trust level, for the identified car.
  PhoneTrustLevel trust = 2;

  // This is the phone that sent the command.
  bool is_requester = 3;
}

// The bonded phones.
message PairedPhones {
  // The phones, in bonding order.
  repeated PairedPhone phones = 1;
}

// The data a system command answers with.
message SystemCommandResult {
  // Which data, by the command it answers.
  oneof result {
    // For ListPairedPhonesCommand.
    PairedPhones paired_phones = 1;

    // For ListPhoneValidationMethodsCommand.
    PhoneValidationMethods validation_methods = 2;

    // For StartPhoneValidationCommand and SubmitPhoneValidationCodeCommand:
    // the sending phone's session after the command. Also set when the command
    // was refused because of the session (no attempts left, cooldown).
    PhoneValidationSession validation_session = 3;
  }
}
