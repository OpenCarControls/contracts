syntax = "proto3";
package opencar.core.v1;

// This holds the system specific state.
message SystemState {
  // The current firmware version string, based on the Github official tagged
  // version or custom build.
  string firmware_version = 1;

  // The hardware type of the device (e.g. ESP32-S3)
  string hardware_type = 2;

  // The uptime of the device in seconds.
  uint32 uptime_s = 3;

  // The LTE signal strength in dBm.
  int32 lte_rssi = 4;

  // The VIN the connected car reported, 17 characters. Unset until the
  // firmware has read it; a VIN is only reported once it is well-formed, but
  // it may belong to a car the firmware doesn't support (see car_identity).
  optional string vin = 5;

  // Whether the firmware has confirmed that the connected car is one its
  // vehicle platform supports. The car's buses stay read-only until it is
  // confirmed.
  optional CarIdentity car_identity = 6;
}

// Whether the connected car's identity has been confirmed.
enum CarIdentity {
  // Not reported (older firmware).
  CAR_IDENTITY_UNSPECIFIED = 0;

  // Not checked yet, or the check didn't get an answer (car asleep, no
  // reply). The buses stay read-only.
  CAR_IDENTITY_UNCONFIRMED = 1;

  // The car matches the vehicle platform the firmware was built for.
  CAR_IDENTITY_CONFIRMED = 2;

  // The car answered but doesn't match the vehicle platform (for example a
  // VIN of another make). The buses stay read-only.
  CAR_IDENTITY_MISMATCH = 3;
}

// This contains a single system command.
message SystemCommand {
  // The system command.
  oneof action {
    // A restart command.
    RestartCommand restart_command = 1;

    // Deprecated: the BLE CAN debug stream was removed from the firmware; CAN
    // logging now goes to SavvyCAN over WiFi. The firmware ignores this.
    SetCanDebugEnabled set_can_debug_enabled = 2 [deprecated = true];

    // Deprecated: see set_can_debug_enabled. The firmware ignores this.
    UpdateCanDebugFilters update_can_debug_filters = 3 [deprecated = true];

    // Returns the currently bonded BLE phones.
    ListPairedPhonesCommand list_paired_phones = 4;

    // Removes one bonded BLE phone by its stable device ID.
    RemovePairedPhoneCommand remove_paired_phone = 5;

    // Removes all bonded BLE phones.
    ClearPairedPhonesCommand clear_paired_phones = 6;

    // Records a newly paired BLE phone in the bonded registry.
    UpsertPairedPhoneCommand upsert_paired_phone = 7;
  }
}

// This command tells the system to restart.
message RestartCommand {}

// Deprecated: the BLE CAN debug stream was removed from the firmware and the
// message is ignored. Kept so field numbers stay reserved (append-only).
//
// Enables or disables on-demand CAN debug streaming over BLE.
//
// When enabled, raw CAN frames (before vehicle-specific filtering) are batched
// and sent to the app as CanDebugUpdate messages on the existing DeviceToApp
// BLE characteristic. No new characteristic or subscription is required.
//
// This command is sent via the existing AppToDevice BLE characteristic.
message SetCanDebugEnabled {
  option deprecated = true;

  // Whether to enable (true) or disable (false) CAN debug streaming.
  bool enabled = 1;

  // The CAN bus IDs to stream. Each value is a 0-based bus index matching the
  // order of [[can_buses]] entries in the device config. An empty list means
  // all buses are observed.
  repeated uint32 bus_ids = 2;
}

// Deprecated: see SetCanDebugEnabled. Ignored by the firmware.
//
// Replaces the full CAN debug blocklist. Silently ignored if CAN debug is
// not currently active.
//
// The app owns the filter state; this message always sends the complete desired
// list. The firmware replaces its stored list atomically on receipt. To clear
// all filters (pass everything), send an empty list.
message UpdateCanDebugFilters {
  option deprecated = true;

  // The new blocklist. Any frame matching any entry is excluded from the
  // CanDebugUpdate stream. An empty list means all frames are forwarded.
  repeated CanDebugFilter filters = 1;
}

// A single CAN debug blocklist entry. A frame is excluded from the debug stream
// if: (frame_can_id & mask) == (can_id & mask) AND is_extended_id matches.
//
// The blocklist applies across all buses being observed; there is no per-bus
// filter scoping.
message CanDebugFilter {
  // The CAN identifier to match against.
  uint32 can_id = 1;

  // True if this filter targets extended (29-bit) frame IDs; false for
  // standard (11-bit) frame IDs.
  bool is_extended_id = 2;

  // Acceptance mask. Bits set to 1 must match between the frame ID and
  // can_id. Use 0x7FF for exact standard-ID match, 0x1FFFFFFF for exact
  // extended-ID match, or 0 to block every frame regardless of ID.
  uint32 mask = 3;
}

// Requests the list of currently bonded BLE phones.
message ListPairedPhonesCommand {}

// Requests removal of a single bonded BLE phone.
message RemovePairedPhoneCommand {
  // Stable firmware-owned identifier for the bonded phone.
  bytes device_id = 1;
}

// Requests removal of all bonded BLE phones.
message ClearPairedPhonesCommand {}

// Adds a bonded BLE phone if it is not already present.
message UpsertPairedPhoneCommand {
  // Stable firmware-owned identifier for the bonded phone.
  bytes device_id = 1;
}

// A firmware-initiated event pushed to the app with no associated inbound
// command. Delivered over the DeviceToApp BLE characteristic.
message SystemEvent {}
